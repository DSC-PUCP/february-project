services:
  app:
    build:
      context: .
    container_name: kaygo-app
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/sqlite.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://dsc.inf.pucp.edu.pe/kaygo
      - NEXT_PUBLIC_APP_URL=https://dsc.inf.pucp.edu.pe/kaygo
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/kaygo/login').then((r)=>process.exit(r.ok ? 0 : ((r.status >= 300 && r.status < 400) ? 0 : 1))).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: kaygo-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/uploads:/app/uploads:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'if wget -q --spider http://127.0.0.1/healthz; then exit 0; else exit 1; fi',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - web

networks:
  web:
    driver: bridge
